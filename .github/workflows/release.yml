name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: wheel, sdist and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false # never restore a cache into a release build
      - name: Version must match the tag and CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short --package evalgate)"
          test "v${version}" = "${TAG}"
          grep -q "^## \[${version}\]" CHANGELOG.md
      - name: make build and make sbom
        run: |
          uv sync --frozen
          make build
          make sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Create the release with wheel, sdist and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "${TAG}" dist/*.whl dist/*.tar.gz dist/sbom.cdx.json --title "${TAG}" --notes-file notes.md

  pypi:
    name: PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Keep only the distributions
        run: rm -f dist/sbom.cdx.json dist/requirements-audit.txt
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
  images:
    name: images to GHCR
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [evalgate, toy-targets]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          TAG: ${{ github.ref_name }}
        run: |
          image="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
          docker build -f "docker/${{ matrix.image }}.Dockerfile" -t "${image}:${TAG}" .
          docker push "${image}:${TAG}"
