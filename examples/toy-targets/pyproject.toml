[project]
name = "toy-targets"
version = "0.1.0"
description = "Deterministic toy AI systems (classify, extract, answer) used to exercise evalgate. Not shipped in the evalgate wheel."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116", "uvicorn>=0.35", "pyyaml>=6.0.2"]

[project.scripts]
toy-targets = "toy_targets.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toy_targets"]
